server:
  port: ${SERVER_PORT:8083}

grpc:
  server:
    port: ${GRPC_PORT:9093}

spring:
  application:
    name: inventory-service
  datasource:
    # Inventory's OWN database. docker-compose sets DB_HOST=inventory-db.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5443}/${DB_NAME:inventory}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      pool-name: inventoryPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

selfcheckout:
  inventory:
    low-stock-threshold: 50
