# API Gateway for the microservices self-checkout system.
#
# The load client speaks to a single base URL (http://localhost:8080) and the
# OpenAPI contract is one flat namespace. This gateway path-routes each external
# endpoint to the microservice that owns it, so the client contract is unchanged
# while the work fans out to four independently deployable services.
#
# These are gateway -> service hops (plain REST). Service-to-service calls happen
# separately over gRPC (not through this gateway).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream catalog   { server catalog-service:8081;    keepalive 32; }
    upstream inventory { server inventory-service:8083;   keepalive 32; }
    upstream checkout  { server checkout-service:8082;    keepalive 32; }
    upstream analytics { server analytics-service:8084;   keepalive 32; }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Catalog Service owns product reference data.
        location = /items      { proxy_pass http://catalog; }

        # Inventory Service owns stock (its own service and database now).
        location /inventory/   { proxy_pass http://inventory; }

        # Checkout Service owns the transaction lifecycle.
        location /transactions { proxy_pass http://checkout; }

        # Analytics Service owns popular-items.
        location /analytics/   { proxy_pass http://analytics; }
    }
}
