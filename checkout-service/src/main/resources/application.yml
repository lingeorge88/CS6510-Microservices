server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: checkout-service
  threads:
    virtual:
      enabled: true          # Tomcat + Kafka listeners on virtual threads; blocking JDBC is cheap
  datasource:
    # Checkout's OWN database. docker-compose sets DB_HOST=checkout-db.
    # reWriteBatchedInserts: the driver turns JDBC batches into multi-row INSERTs.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:checkout}?reWriteBatchedInserts=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # The hot service: 100 stations' scans/completes share this pool.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:20}
      pool-name: checkoutPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                    # wait until the broker has durably stored the message
      properties:
        enable.idempotence: true   # producer retries can't create duplicates in the log
        linger.ms: 5               # wait up to 5 ms to batch the relay's sends together
    consumer:
      auto-offset-reset: earliest  # a new consumer group starts from the oldest event
      max-poll-records: 500
      properties:
        fetch.max.wait.ms: 50      # default 500 ms would add up to 0.5 s of event lag

selfcheckout:
  outbox:
    # How often OutboxRelay polls the outbox table for committed events.
    poll-interval-ms: 10
