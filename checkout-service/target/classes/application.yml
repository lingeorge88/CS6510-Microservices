server:
  port: ${SERVER_PORT:8082}

grpc:
  # Targets of the services Checkout calls. Default to localhost for bare-JVM
  # runs; docker-compose overrides with the service names and gRPC ports.
  client:
    catalog: ${CATALOG_GRPC_TARGET:localhost:9091}
    inventory: ${INVENTORY_GRPC_TARGET:localhost:9093}
    analytics: ${ANALYTICS_GRPC_TARGET:localhost:9094}

spring:
  application:
    name: checkout-service
  datasource:
    # Checkout's OWN database. docker-compose sets DB_HOST=checkout-db.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:checkout}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      pool-name: checkoutPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
