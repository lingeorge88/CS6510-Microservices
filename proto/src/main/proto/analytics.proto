syntax = "proto3";

package selfcheckout.analytics;

option java_multiple_files = true;
option java_package = "com.selfcheckout.grpc.analytics";
option java_outer_classname = "AnalyticsProto";

// Analytics owns the scan log and popular-items ranking. Checkout calls LogScan
// best-effort on each scan (fire-and-forget: analytics being down must never fail
// a scan). The item name is carried in the event so analytics never needs to join
// the catalog's database.
service AnalyticsService {
  rpc LogScan (LogScanRequest) returns (LogScanResponse);
}

message LogScanRequest {
  string sku = 1;
  string name = 2;
}

message LogScanResponse {
  bool accepted = 1;
}
