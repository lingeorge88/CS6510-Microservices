# Event-driven microservices self-checkout system.
#
# Four independently deployable services, EACH WITH ITS OWN Postgres database:
#   catalog-service   + catalog-db      (catalog_items)
#   inventory-service + inventory-db    (inventory_stock, processed_transactions, outbox)
#   checkout-service  + checkout-db     (transactions, transaction_line_items, outbox, processed_events)
#   analytics-service + analytics-db    (scan_events, popular_items_snapshot)
# plus an nginx api-gateway that preserves the flat OpenAPI contract on :8080,
# a Kafka broker that carries ALL inter-service communication, and Kafka UI.
#
# Services never call each other; they publish/consume Kafka events:
#   catalog.items                   catalog   -> checkout   (compacted price/name snapshot)
#   checkout.item-scanned           checkout  -> analytics  (popular items)
#   checkout.transaction-completed  checkout  -> inventory  (stock decrement)
#   inventory.stock-shortfall       inventory -> checkout   (saga compensation)
#
# Build + start with fresh databases and topics:   ./start.sh
# Stop:                                            docker compose down
# Load client target: http://localhost:8080    Kafka UI: http://localhost:8090

services:
  # --- Message broker (single-node KRaft, no ZooKeeper) ----------------------
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker: internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Don't delay the first consumer-group rebalance (default 3s) at startup.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services (KafkaTopicsConfig), with explicit
      # partitions and compaction — never silently auto-created with defaults.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Web UI for inspecting topics, messages, consumer groups and lag.
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: selfcheckout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # --- Databases (one per service) ------------------------------------------
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog
    volumes:
      - ./db/catalog/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 30

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - ./db/inventory/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  checkout-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkout
    volumes:
      - ./db/checkout/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout"]
      interval: 2s
      timeout: 3s
      retries: 30

  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    volumes:
      - ./db/analytics/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- Services --------------------------------------------------------------
  catalog-service:
    build: ./catalog-service
    restart: on-failure
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5432
      DB_NAME: catalog
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Ready = the REST port is accepting connections. CatalogPublisher runs before
    # Tomcat binds, so this implies the catalog snapshot is already in Kafka.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  inventory-service:
    build: ./inventory-service
    restart: on-failure
    environment:
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  checkout-service:
    build: ./checkout-service
    restart: on-failure
    environment:
      DB_HOST: checkout-db
      DB_PORT: 5432
      DB_NAME: checkout
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_POOL_SIZE: 20
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    # Needs catalog's snapshot in Kafka to build its replica; does NOT need
    # inventory or analytics to be up (events wait in Kafka until they are).
    depends_on:
      checkout-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    # CatalogReplica loads before Tomcat binds, so "port open" implies "replica ready".
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  analytics-service:
    build: ./analytics-service
    restart: on-failure
    environment:
      DB_HOST: analytics-db
      DB_PORT: 5432
      DB_NAME: analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      analytics-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # --- Gateway ---------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    # Only publish :8080 once every service is actually accepting connections, so
    # the load client can never hit a service mid-boot (avoids startup-race refusals).
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      checkout-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
