server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: analytics-service
  threads:
    virtual:
      enabled: true          # Tomcat + Kafka listeners on virtual threads; blocking JDBC is cheap
  datasource:
    # Analytics' OWN database. docker-compose sets DB_HOST=analytics-db.
    # reWriteBatchedInserts: the driver turns JDBC batches into multi-row INSERTs.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5444}/${DB_NAME:analytics}?reWriteBatchedInserts=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      pool-name: analyticsPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest  # a new consumer group starts from the oldest event
      max-poll-records: 500        # up to 500 scans inserted per batch
      properties:
        fetch.max.wait.ms: 50      # default 500 ms would add up to 0.5 s of event lag

selfcheckout:
  analytics:
    window-size: 1000
    slide-interval: 500
    popular-items-limit: 10
    # Rows persisted per window (bounds snapshot size; well above any client limit).
    snapshot-depth: 100
    # How often the service polls its own scan log for a new slide boundary.
    recompute-interval-ms: 500
