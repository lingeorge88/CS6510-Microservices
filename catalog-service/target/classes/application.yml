server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true          # Tomcat request threads are virtual threads; blocking JDBC is cheap
  datasource:
    # Catalog's OWN database. Host defaults to localhost for bare-JVM runs;
    # docker-compose sets DB_HOST=catalog-db.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5441}/${DB_NAME:catalog}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      pool-name: catalogPool
  jpa:
    hibernate:
      # Schema is owned by the database (created once by the Postgres init scripts).
      ddl-auto: none
    open-in-view: false
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all              # wait until the broker has durably stored the message
      properties:
        enable.idempotence: true   # producer retries can't create duplicates in the log
        linger.ms: 5               # wait up to 5 ms to batch sends together